name: Deploy & Build Attendance Tracker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Mobile APK Build Job (Commented out for now — uncomment to enable APK build)
  # ============================================================================
  build-apk:
    name: Build Android APK (GitHub Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest code
        uses: actions/checkout@v4
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
  
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
  
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
  
      - name: Configure Gradle Environment
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.http.keepAlive=false
          EOF
  
      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci
  
      - name: Generate Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean
          # Increase network timeout from 10s to 120s to prevent 504 Gateway Timeouts
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
  
      - name: Build Standalone Release APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon || (echo "Retrying with --refresh-dependencies..." && sleep 5 && ./gradlew assembleRelease --no-daemon --refresh-dependencies)
  
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-tracker-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  deploy:
    name: Deploy Server & Web (Self-Hosted)
    needs: build-apk
    if: always()
    runs-on: self-hosted
    steps:
      - name: Check out latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Built APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: attendance-tracker-apk
          path: downloaded-apk

      - name: Build and Deploy Web
        run: |
          mkdir -p /opt/attendance-tracker/web
          npm --prefix web ci || npm --prefix web install
          npm --prefix web run build
          rsync -rv --delete web/dist/ /opt/attendance-tracker/web/
          # If fresh APK was downloaded, link it directly to the web root for one-click browser download
          if [ -d "downloaded-apk" ]; then
            APK_FILE=$(find downloaded-apk -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" /opt/attendance-tracker/web/attendance-tracker.apk
              chmod 644 /opt/attendance-tracker/web/attendance-tracker.apk
              echo "Published $APK_FILE to /opt/attendance-tracker/web/attendance-tracker.apk"
            fi
          fi

      - name: Deploy Server
        run: |
          mkdir -p /opt/attendance-tracker/server/data
          # Sync server code while protecting production DB, .env, and node_modules
          rsync -rv --delete --exclude 'data/' --exclude 'node_modules/' --exclude '.env' server/ /opt/attendance-tracker/server/
          cd /opt/attendance-tracker/server
          npm install --omit=dev

      - name: Restart PM2 Service
        run: |
          cd /opt/attendance-tracker/server
          pm2 restart attendance-server || pm2 start src/index.js --name attendance-server
          pm2 save
